<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatoTesty</title>
<meta name="description" content="PatoTesty – sprawdź, ile wiesz o patocelebrytach z polskiego internetu.">
<link rel="icon" type="image/svg+xml" href="https://patotesty.pages.dev/themes/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#ff2d55;
  --ink:#1d1d1f; --paper:#f5f5f7; --white:#fff; --mute:#6e6e73;
  --font:'Inter Tight',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}

/* NAGŁÓWEK (bez zmian) */
nav{position:fixed;inset:0 0 auto;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);
  background:rgba(12,12,14,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);transform:translateY(-100%);animation:navIn .9s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes navIn{to{transform:none}}
nav img{height:26px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 17px/1 var(--font);padding:16px 30px;border-radius:999px;background:var(--accent);color:#fff;border:0;cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .2s}
.btn:hover{transform:scale(1.05);box-shadow:0 14px 40px -10px var(--accent)}
.btn:active{transform:scale(.98)}
.btn.sm{font-size:14px;padding:9px 18px}

/* WEJŚCIE: logo, potem pasy ze zdjęciami */
.intro{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4vh,40px);padding:84px 0 40px;position:relative;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none}
.orb.a{width:46vmax;height:46vmax;background:#ffc4cf;left:-14vmax;top:-12vmax}
.orb.b{width:38vmax;height:38vmax;background:#d9dcff;right:-12vmax;bottom:-12vmax}

.logo{position:relative;width:min(560px,78vw);opacity:0;transform:scale(.6);filter:blur(14px);animation:pop 1.3s .15s var(--ease) forwards}
.logo img{width:100%;display:block}
@keyframes pop{60%{filter:blur(0)}to{opacity:1;transform:none;filter:blur(0)}}

.lead{text-align:center;padding:0 20px;opacity:0;transform:translateY(16px);animation:up 1s 1.3s var(--ease) forwards}
.lead p{font-size:clamp(18px,2.2vw,24px);line-height:1.35;color:var(--mute);font-weight:500;max-width:30ch;margin:0 auto}
@keyframes up{to{opacity:1;transform:none}}

.stage{width:100%;display:flex;flex-direction:column;gap:clamp(12px,2vw,20px);opacity:0;transform:translateY(40px);animation:up 1.4s 1.9s var(--ease) forwards;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
.row{overflow:hidden}
.track{display:flex;gap:clamp(12px,2vw,20px);width:max-content;animation:run var(--t,60s) linear infinite}
.row.rev .track{animation-direction:reverse}
.stage:hover .track{animation-play-state:paused}
@keyframes run{to{transform:translateX(-50%)}}
.card{position:relative;flex:none;height:clamp(150px,24vh,240px);aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:#d8d8dc;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.45)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card span{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em;
  background:linear-gradient(transparent,rgba(0,0,0,.7))}

.go{opacity:0;transform:translateY(16px);animation:up 1s 2.6s var(--ease) forwards}

footer{background:var(--white);padding:36px clamp(20px,5vw,48px);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;font-size:14px;color:var(--mute);border-top:1px solid rgba(0,0,0,.08)}
footer img{height:22px;display:block}
footer strong{color:var(--ink);font-weight:600}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important}
  .track{animation:none!important}
  .row{overflow-x:auto}
}
</style>
</head>
<body>

<nav>
  <a href="/" aria-label="PatoTesty – strona główna"><img src="https://patotesty.pages.dev/themes/patotesty_horizontal_color.svg" alt="PatoTesty"></a>
  <a class="btn sm" href="/testy">Przejdź do testów</a>
</nav>

<header class="intro">
  <div class="orb a"></div><div class="orb b"></div>

  <div class="logo"><img src="https://patotesty.pages.dev/themes/patotesty_horizontal_color.svg" alt="PatoTesty"></div>

  <div class="lead"><p>Memy, afery i live’y. Zobacz, czy rozpoznasz bohaterów polskiego internetu.</p></div>

  <div class="stage" aria-label="Patocelebryci z polskiego internetu">
    <div class="row" id="r1"><div class="track"></div></div>
    <div class="row rev" id="r2"><div class="track"></div></div>
  </div>

  <a class="btn go" href="/testy">Zacznij test</a>
</header>

<footer>
  <img src="https://patotesty.pages.dev/themes/patotesty_horizontal_black.svg" alt="PatoTesty">
  <span>Wykonanie: <strong>RAKSO Web Development</strong></span>
</footer>

<script>
/* name = tylko tekst alternatywny zdjęcia (nie jest wyświetlany). */
const PEOPLE = [
  {img:"web-content/magda-kłosowska-chaja.png", name:"Magda Kłosowska"},
  {img:"web-content/Iza.webp", name:"Izabela Kisio-Skorupa"},
  {img:"web-content/480210.3.jpg", name:"Jelly Frucik"},
  {img:"web-content/DanielMagicalZdjecie.webp", name:"Daniel Magical"},
  {img:"web-content/Popek_2018.jpg", name:"Popek"},
  {img:"web-content/aniela-magda.png", name:""},
  {img:"web-content/ZEhk9kpTURBXy8yMGQ1ZmQ4ODUyNTNiYmViNDgyYzU5MGQ2NDA5MGQ3Ni5wbmeTlQMAAM0WgM0MqJMFzQFozQH0kwXNBLDNBoPeAAKhMAWhMQA.webp", name:""},
  {img:"web-content/ab6761610000e5eb821b6b1a8bd480cc8b428152.jpeg", name:""},
  {img:"web-content/images-10.jpeg", name:""},
  {img:"web-content/images-11.jpeg", name:""},
  {img:"web-content/images-12.jpeg", name:""},
  {img:"web-content/images-13.jpeg", name:""},
  {img:"web-content/images-14.jpeg", name:""},
  {img:"web-content/images-15.jpeg", name:""},
  {img:"web-content/pLUk9kpTURBXy85ODA0OTQwMmFiNDcyYmQ2ZTBiMGQ2OWUwMWU3NjUyOC5wbmeTlQMAAM0DsM0CE5MFzQFozQH0kwXNBLDNBoPeAAKhMAWhMQA.webp", name:""}
];

function fill(id, list, secs){
  const track = document.querySelector('#'+id+' .track');
  const make = (p, hidden) => {
    const c = document.createElement('figure');
    c.className = 'card';
    if(hidden) c.setAttribute('aria-hidden','true');
    const i = new Image();
    i.src = encodeURI(p.img); i.alt = hidden ? '' : (p.name || 'Patocelebryta'); i.loading = 'eager'; i.decoding = 'async';
    c.appendChild(i);
    return c;
  };
  /* dwie kopie listy = płynna pętla (animacja przesuwa o 50%) */
  list.forEach(p => track.appendChild(make(p,false)));
  list.forEach(p => track.appendChild(make(p,true)));
  track.style.setProperty('--t', secs+'s');
}

const half = Math.ceil(PEOPLE.length/2);
fill('r1', PEOPLE.slice(0,half), 70);
fill('r2', PEOPLE.slice(half).concat(PEOPLE.slice(0,2)), 80);
</script>
</body>
</html>
