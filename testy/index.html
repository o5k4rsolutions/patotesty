<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testy | PatoTesty</title>
<meta name="description" content="Wybierz test z PatoTesty i sprawdź, ile wiesz o patocelebrytach z polskiego internetu.">
<link rel="icon" type="image/svg+xml" href="https://patotesty.pages.dev/themes/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#ff2d55;
  --ink:#1d1d1f; --paper:#f5f5f7; --white:#fff; --mute:#6e6e73;
  --font:'Inter Tight',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:var(--font);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}

nav{position:fixed;inset:0 0 auto;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);
  background:rgba(12,12,14,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);transform:translateY(-100%);animation:navIn .9s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes navIn{to{transform:none}}
nav img{height:26px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 17px/1 var(--font);padding:16px 30px;border-radius:999px;background:var(--accent);color:#fff;border:0;cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .2s}
.btn:hover{transform:scale(1.05);box-shadow:0 14px 40px -10px var(--accent)}
.btn:active{transform:scale(.98)}
.btn.sm{font-size:14px;padding:9px 18px}

main{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:clamp(28px,5vh,56px);padding:112px clamp(20px,5vw,48px) 80px}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.orb.a{width:46vmax;height:46vmax;background:#ffc4cf;left:-16vmax;top:-12vmax}
.orb.b{width:38vmax;height:38vmax;background:#d9dcff;right:-14vmax;bottom:-14vmax;animation-delay:-6s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

.logo{position:relative;width:min(520px,76vw);z-index:1}
.logo .base{width:100%;display:block;opacity:0;animation:show .01s 1.7s forwards}
.logo .piece{position:absolute;inset:0;width:100%;height:100%;opacity:0;
  animation:snap 1.1s var(--d) cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes snap{
  0%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.6)}
  30%{opacity:1}
  100%{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
.logo::after{content:"";position:absolute;inset:-10% 0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);
  mix-blend-mode:overlay;transform:translateX(-100%);animation:shine 1.2s 1.8s ease-out forwards}
@keyframes shine{20%{opacity:1}to{opacity:1;transform:translateX(100%)}}

.head{position:relative;z-index:1;text-align:center;opacity:0;transform:translateY(16px);animation:up 1s 2s var(--ease) forwards}
.head h1{font-size:clamp(32px,5vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1}
.head p{margin-top:12px;color:var(--mute);font-size:clamp(17px,1.8vw,22px);font-weight:500;line-height:1.35}
@keyframes up{to{opacity:1;transform:none}}

.grid{position:relative;z-index:1;width:100%;max-width:980px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(18px,3vw,32px)}
.test{display:flex;flex-direction:column;border-radius:34px;background:var(--white);overflow:hidden;box-shadow:0 30px 60px -34px rgba(0,0,0,.4);
  opacity:0;transform:translateY(-120px) rotate(var(--tilt,-3deg));animation:land 1.1s calc(2.4s + var(--i)*.18s) cubic-bezier(.3,1.4,.4,1) forwards;
  transition:transform .5s var(--ease),box-shadow .5s}
@keyframes land{to{opacity:1;transform:none}}
.test:hover{transform:translateY(-8px);box-shadow:0 40px 70px -30px rgba(0,0,0,.5)}
.pic{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,#ffc4cf,#d9dcff)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:transform .8s var(--ease)}
.test:hover .pic img{transform:scale(1.07)}
.info{display:flex;flex-direction:column;gap:6px;padding:24px 26px 28px;flex:1}
.info h2{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.info p{color:var(--mute);font-size:17px;font-weight:500;line-height:1.35}
.info .btn{margin-top:auto;align-self:flex-start;margin-top:18px}

footer{background:var(--white);padding:36px clamp(20px,5vw,48px);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;font-size:14px;color:var(--mute);border-top:1px solid rgba(0,0,0,.08)}
footer img{height:22px;display:block}
footer strong{color:var(--ink);font-weight:600}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<nav>
  <a href="/" aria-label="PatoTesty – strona główna"><img src="https://patotesty.pages.dev/themes/patotesty_horizontal_color.svg" alt="PatoTesty"></a>
  <a class="btn sm" href="/">Strona główna</a>
</nav>

<main>
  <div class="orb a" aria-hidden="true"></div><div class="orb b" aria-hidden="true"></div>

  <div class="logo" id="logo" role="img" aria-label="PatoTesty">
    <img class="base" src="https://patotesty.pages.dev/themes/patotesty_horizontal_black.svg" alt="">
  </div>

  <div class="head">
    <h1>Wybierz test</h1>
    <p>Kogo chcesz sprawdzić dzisiaj?</p>
  </div>

  <section class="grid" aria-label="Lista testów">
    <article class="test" style="--i:0;--tilt:-3deg">
      <div class="pic"><img src="/web-content/magda-kłosowska-chaja.png" alt="Magda Kłosowska" onerror="this.remove()"></div>
      <div class="info">
        <h2>Magda Kłosowska</h2>
        <p>Znana jako „Haja”. Rozpoznasz ją po nagraniach?</p>
        <a class="btn" href="/Magda-klosowska">Zacznij test</a>
      </div>
    </article>

    <article class="test" style="--i:1;--tilt:3deg">
      <div class="pic"><img src="/web-content/Iza.webp" alt="Izabela Kisio-Skorupa" onerror="this.remove()"></div>
      <div class="info">
        <h2>Izabela Kisio-Skorupa</h2>
        <p>„Mama Kisio”. Ile naprawdę o niej wiesz?</p>
        <a class="btn" href="/Izabela-kisio-skorupa">Zacznij test</a>
      </div>
    </article>
  </section>
</main>

<footer>
  <img src="https://patotesty.pages.dev/themes/patotesty_horizontal_black.svg" alt="PatoTesty">
  <span>Wykonanie: <strong>RAKSO Web Development</strong></span>
</footer>

<script>
(function(){
  const box=document.getElementById('logo'), src=box.querySelector('.base').src, N=8;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  for(let i=0;i<N;i++){
    const l=Math.max(0,i*100/N-.2), r=Math.max(0,100-(i+1)*100/N-.2);
    const im=new Image(); im.src=src; im.alt=''; im.className='piece'; im.setAttribute('aria-hidden','true');
    im.style.clipPath=`inset(0 ${r}% 0 ${l}%)`;
    const up=i%2?1:-1;
    im.style.setProperty('--x',rnd(-60,60)+'px');
    im.style.setProperty('--y',up*rnd(160,320)+'px');
    im.style.setProperty('--r',rnd(-25,25)+'deg');
    im.style.setProperty('--d',(.2+i*.1).toFixed(2)+'s');
    box.appendChild(im);
  }
})();
</script>
</body>
</html>
