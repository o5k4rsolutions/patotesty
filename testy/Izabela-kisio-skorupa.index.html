<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: Izabela Kisio-Skorupa | PatoTesty</title>
<link rel="icon" type="image/svg+xml" href="https://patotesty.pages.dev/themes/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#ff2d55;--ink:#1d1d1f;--paper:#f5f5f7;--mute:#6e6e73;--ok:#1f9d55;--bad:#d92d20;--font:'Inter Tight',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
nav{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);background:rgba(12,12,14,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
nav img{height:26px;display:block}
nav a.back{color:#c7c7cc;font-size:14px;font-weight:600;text-decoration:none}
.bar{height:4px;background:rgba(0,0,0,.08)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s cubic-bezier(.16,1,.3,1)}
main{max-width:1100px;margin:0 auto;padding:clamp(28px,6vh,64px) clamp(16px,4vw,32px) 80px}
.scene{animation:in .7s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(36px) scale(.98)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 17px/1 var(--font);padding:16px 30px;border-radius:999px;background:var(--accent);color:#fff;border:0;text-decoration:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .2s}
.btn:hover{transform:scale(1.05);box-shadow:0 14px 40px -10px var(--accent)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.btn[disabled]{opacity:.35;pointer-events:none}
.intro{text-align:center;padding:6vh 0}
.intro h1{font-size:clamp(44px,9vw,120px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.intro p{margin:22px auto 36px;max-width:460px;font-size:clamp(18px,2vw,23px);color:var(--mute);font-weight:500;line-height:1.35}
.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:start}
.solo{max-width:720px;margin:0 auto}
.vid{position:relative;background:#000;border-radius:28px;overflow:hidden;aspect-ratio:9/16;max-height:72vh;margin:0 auto;width:100%}
.vid video{width:100%;height:100%;object-fit:contain;display:block}
.vid .play{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:30px;color:var(--ink)}
.vid .play[hidden]{display:none}
.qbox h2{font-size:clamp(28px,3.6vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-bottom:12px}
.hint{color:var(--mute);font-size:16px;font-weight:500;margin-bottom:22px;min-height:22px}
.opts{display:grid;gap:12px;transition:opacity .4s}
.opts.locked{opacity:.3;pointer-events:none}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px 20px;font-size:19px;font-weight:600;color:var(--ink);background:#fff;border:0;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s}
.opt b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--paper);font-size:15px}
.opt:hover{transform:translateX(6px) scale(1.01);box-shadow:inset 0 0 0 2px var(--ink)}
.opt.ok{background:var(--ok);color:#fff;box-shadow:none}.opt.ok b{background:rgba(255,255,255,.25)}
.opt.no{background:var(--bad);color:#fff;box-shadow:none;animation:shake .4s}.opt.no b{background:rgba(255,255,255,.25)}
.opt.done{pointer-events:none}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin:22px 0 4px;font-size:19px;font-weight:700;min-height:28px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.next{margin-top:18px}
.tf{display:grid;gap:14px;margin-top:6px}
.tfr{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.tfr p{font-size:19px;font-weight:600;margin-bottom:14px;line-height:1.3}
.tfr .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfr .opt{justify-content:center;padding:14px}
.tfr .res{margin-top:10px;font-size:15px;font-weight:700;min-height:20px}
.res.ok{color:var(--ok)}.res.no{color:var(--bad)}
.result{text-align:center;padding:4vh 0}
.result small{font-size:clamp(20px,2.4vw,28px);color:var(--mute);font-weight:600}
.score{font-size:clamp(100px,24vw,300px);font-weight:800;letter-spacing:-.06em;line-height:.9;margin:8px 0 10px}
.score span{color:var(--accent)}
.result p.msg{font-size:clamp(18px,2vw,24px);font-weight:600;margin-bottom:30px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.review{margin:40px auto 0;max-width:720px;text-align:left;display:grid;gap:12px}
.rv{background:#fff;border-radius:18px;padding:16px 20px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);animation:in .6s both}
.rv h3{font-size:17px;font-weight:700;margin-bottom:8px;line-height:1.25}
.rv div{font-size:15px;font-weight:600;line-height:1.5}
.rv .g{color:var(--ok)}.rv .r{color:var(--bad)}.rv .m{color:var(--mute)}
@media(max-width:820px){.split{grid-template-columns:1fr}.vid{max-height:58vh;aspect-ratio:9/14}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<nav>
  <a href="/" aria-label="PatoTesty – strona główna"><img src="https://patotesty.pages.dev/themes/patotesty_horizontal_color.svg" alt="PatoTesty"></a>
  <a class="back" href="/">Strona główna</a>
</nav>
<div class="bar"><i id="pb"></i></div>
<main id="app"></main>

<script>
const V = "https://patotesty.pages.dev/web-content/wideo/";
const L = "ABCD";
const STEPS = [
  {k:"video", q:"Co Rafalala zrobiła na tym nagraniu?", src:V+"v0f044gc0000chp2bjjc77u26iqjbeog.mov", stop:4,
   o:["Rzuciła się na Izę","Oblała Izę kawą","Oblała Izę sokiem","Nic"], c:1},
  {k:"video", q:"Co Iza odpowiedziała?", src:V+"v24044gl0000cvasedvog65pse7r3a7g.mov", stop:4,
   o:["No witam","Jezu","Wypierdalaj","Żegnam"], c:0},
  {k:"video", q:"Czym Iza wgl nie jest?", src:V+"v0f044gc0000ct45kqnog65jp2nbsou0.mov", stop:6,
   o:["Lesbijką","Elgietebie","Gejem","Dziwką"], c:1},
  {k:"text", q:"Jakie relacje ma Iza ze swoją córką?",
   o:["Świetne","Okropne","Mierne","Nie ma córki"], c:1},
  {k:"watch", q:"Jaka jest Iza?", hint:"Obejrzyj nagranie do końca i odpowiedz.", src:V+"v26044gc0000d6uih1fog65qkrsmpmeg.mov",
   o:["Normalna","Dwubiegunowa"], c:1},
  {k:"tf", q:"Oceń prawdziwość poniższych zdań.",
   items:[["Izabela pochodzi z Odessy",true],["Izabela uwielbia wpłaty 0,1 grosz",false],["Izabela nie pojechała na koncert Beyonce",false]]},
  {k:"final", src:V+"v26044gc0000dai7k1fog65pehun0cm0.mov"}
];
const MAX = 5 + 3;
const app = document.getElementById('app'), pb = document.getElementById('pb');
let i = -1, score = 0, log = [], raf = 0;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const optsHtml = (o, locked) => `<div class="opts ${locked?'locked':''}" id="opts">` +
  o.map((t,n)=>`<button class="opt" data-n="${n}"><b>${L[n]}</b>${esc(t)}</button>`).join('') + `</div>`;
const scene = html => { cancelAnimationFrame(raf); app.innerHTML = `<div class="scene">${html}</div>`; scrollTo({top:0,behavior:'smooth'}); pb.style.width = Math.max(0,i)/ (STEPS.length) * 100 + '%'; };
const nextBtn = (label='Dalej') => `<button class="btn next" id="nx">${label}</button>`;

function intro(){
  i = -1; score = 0; log = [];
  pb.style.width = '0';
  scene(`<div class="intro"><h1>Izabela<br>Kisio-Skorupa</h1>
  <p>Test o Mamie Kisio. Włącz dźwięk – będą nagrania.</p>
  <button class="btn" id="go">Zacznij test</button></div>`);
  document.getElementById('go').onclick = () => { i = 0; step(); };
}

function playSafe(v, pl){ const p = v.play(); if(p && p.catch) p.catch(()=>{ pl.hidden = false; }); }
function vidHtml(src){ return `<div class="vid"><video id="v" src="${src}" playsinline preload="auto"></video><button class="play" id="pl" hidden aria-label="Odtwórz">&#9654;</button></div>`; }

function step(){
  const s = STEPS[i];
  if(s.k==='video') return videoQ(s);
  if(s.k==='text') return textQ(s);
  if(s.k==='watch') return watchQ(s);
  if(s.k==='tf') return tfQ(s);
  return finalV(s);
}

function answer(s, n, box, v){
  const ok = n === s.c;
  if(ok) score++;
  log.push({q:s.q, chosen:s.o[n], right:s.o[s.c], ok});
  box.querySelectorAll('.opt').forEach((b,x)=>{ b.classList.add('done'); if(x===s.c) b.classList.add('ok'); else if(x===n) b.classList.add('no'); });
  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok?'ok':'no');
  fb.textContent = ok ? 'Dobrze!' : 'Poprawna odpowiedź: ' + s.o[s.c];
  document.getElementById('nxw').innerHTML = nextBtn();
  document.getElementById('nx').onclick = () => { i++; step(); };
  if(v){ v.controls = true; v.currentTime = 0; v.play().catch(()=>{}); }
}

function videoQ(s){
  scene(`<div class="split">${vidHtml(s.src)}<div class="qbox"><h2>${esc(s.q)}</h2>
    <p class="hint" id="hint">Oglądaj – nagranie zatrzyma się na ${s.stop}. sekundzie.</p>
    ${optsHtml(s.o,true)}<div class="fb" id="fb"></div><div id="nxw"></div></div></div>`);
  const v = document.getElementById('v'), pl = document.getElementById('pl'), box = document.getElementById('opts');
  pl.onclick = () => { pl.hidden = true; v.play(); };
  let held = false;
  const unlock = () => { if(held) return; held = true; v.pause(); cancelAnimationFrame(raf);
    document.getElementById('hint').textContent = 'Wybierz odpowiedź. Potem puścimy całe nagranie.';
    box.classList.remove('locked'); };
  const loop = () => { if(v.currentTime >= s.stop) unlock(); else raf = requestAnimationFrame(loop); };
  v.addEventListener('playing', () => { pl.hidden = true; if(!held){ cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); } });
  v.addEventListener('error', unlock);
  playSafe(v, pl);
  box.onclick = e => { const b = e.target.closest('.opt'); if(b) answer(s, +b.dataset.n, box, v); };
}

function textQ(s){
  scene(`<div class="solo qbox"><h2>${esc(s.q)}</h2><p class="hint">Wybierz odpowiedź.</p>${optsHtml(s.o)}<div class="fb" id="fb"></div><div id="nxw"></div></div>`);
  const box = document.getElementById('opts');
  box.onclick = e => { const b = e.target.closest('.opt'); if(b) answer(s, +b.dataset.n, box, null); };
}

function watchQ(s){
  scene(`<div class="split">${vidHtml(s.src)}<div class="qbox"><h2>${esc(s.q)}</h2>
    <p class="hint" id="hint">${esc(s.hint)}</p>${optsHtml(s.o,true)}<div class="fb" id="fb"></div><div id="nxw"></div></div></div>`);
  const v = document.getElementById('v'), pl = document.getElementById('pl'), box = document.getElementById('opts');
  v.controls = true;
  pl.onclick = () => { pl.hidden = true; v.play(); };
  const unlock = () => { box.classList.remove('locked'); document.getElementById('hint').textContent = 'Wybierz odpowiedź.'; };
  v.addEventListener('ended', unlock); v.addEventListener('error', unlock);
  v.addEventListener('playing', () => pl.hidden = true);
  playSafe(v, pl);
  box.onclick = e => { const b = e.target.closest('.opt'); if(b){ v.pause(); answer(s, +b.dataset.n, box, null); } };
}

function tfQ(s){
  scene(`<div class="solo qbox"><h2>${esc(s.q)}</h2><p class="hint">Prawda czy fałsz?</p><div class="tf">` +
    s.items.map((it,n)=>`<div class="tfr" data-n="${n}"><p>${String.fromCharCode(65+n)}. ${esc(it[0])}</p>
      <div class="pair"><button class="opt" data-a="1">Prawda</button><button class="opt" data-a="0">Fałsz</button></div><div class="res"></div></div>`).join('') +
    `</div><div id="nxw"></div></div>`);
  let left = s.items.length;
  app.querySelectorAll('.tfr').forEach(row => {
    row.onclick = e => {
      const b = e.target.closest('.opt'); if(!b || row.dataset.d) return;
      row.dataset.d = 1;
      const it = s.items[+row.dataset.n], said = b.dataset.a === '1', ok = said === it[1];
      if(ok) score++;
      log.push({q:'Oceń prawdziwość: ' + it[0], chosen: said?'Prawda':'Fałsz', right: it[1]?'Prawda':'Fałsz', ok});
      row.querySelectorAll('.opt').forEach(x => { x.classList.add('done'); if((x.dataset.a==='1') === it[1]) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
      const r = row.querySelector('.res'); r.className = 'res ' + (ok?'ok':'no'); r.textContent = ok ? 'Dobrze!' : 'Poprawnie: ' + (it[1]?'Prawda':'Fałsz');
      if(--left === 0){ document.getElementById('nxw').innerHTML = nextBtn('Obejrzyj finał'); document.getElementById('nx').onclick = () => { i++; step(); }; }
    };
  });
}

function finalV(s){
  scene(`<div class="solo qbox" style="text-align:center"><h2>Na koniec: całe nagranie</h2><p class="hint" id="hint">Obejrzyj do końca, a pokażemy wyniki.</p>${vidHtml(s.src)}<div id="nxw" style="margin-top:20px"><button class="btn" id="nx" disabled>Pokaż wyniki</button></div></div>`);
  const v = document.getElementById('v'), pl = document.getElementById('pl'), nx = document.getElementById('nx');
  v.controls = true;
  pl.onclick = () => { pl.hidden = true; v.play(); };
  const done = () => { nx.disabled = false; };
  v.addEventListener('ended', done); v.addEventListener('error', done);
  v.addEventListener('playing', () => pl.hidden = true);
  playSafe(v, pl);
  nx.onclick = () => { i++; results(); };
}

function results(){
  pb.style.width = '100%';
  const pct = score / MAX;
  const msg = pct === 1 ? 'Komplet. Znasz Mamę Kisio na wylot.' : pct >= .6 ? 'Całkiem nieźle. Widać, że śledzisz temat.' : 'Do powtórki. Oglądaj uważniej.';
  scene(`<div class="result"><small>Twój wynik</small><div class="score"><span id="sc">0</span>/${MAX}</div><p class="msg">${msg}</p>
    <div class="acts"><button class="btn" id="rv">Sprawdź swoje odpowiedzi</button><button class="btn ghost" id="again">Zagraj jeszcze raz</button><a class="btn ghost" href="/">Strona główna</a></div>
    <div class="review" id="review" hidden></div></div>`);
  const sc = document.getElementById('sc'); let n = 0;
  const t = setInterval(() => { sc.textContent = n; if(n++ >= score) clearInterval(t); }, 180);
  document.getElementById('again').onclick = intro;
  document.getElementById('rv').onclick = () => {
    const r = document.getElementById('review');
    r.innerHTML = log.map((l,x) => `<div class="rv" style="animation-delay:${x*60}ms"><h3>${esc(l.q)}</h3>
      <div class="${l.ok?'g':'r'}">Twoja odpowiedź: ${esc(l.chosen)}</div>${l.ok?'':`<div class="m">Poprawna: ${esc(l.right)}</div>`}</div>`).join('');
    r.hidden = false; r.scrollIntoView({behavior:'smooth', block:'start'});
  };
}

intro();
</script>
</body>
</html>
