<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: Magda Kłosowska | PatoTesty</title>
<link rel="icon" type="image/svg+xml" href="https://patotesty.pages.dev/themes/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#ff2d55;--ink:#1d1d1f;--paper:#f5f5f7;--mute:#6e6e73;--ok:#1f9d55;--bad:#d92d20;--font:'Inter Tight',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
nav{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);background:rgba(12,12,14,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
nav img{height:26px;display:block}
nav .btn{padding:12px 22px;font-size:15px}
.bar{height:4px;background:rgba(0,0,0,.08)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s cubic-bezier(.16,1,.3,1)}
main{max-width:1100px;margin:0 auto;padding:clamp(28px,6vh,64px) clamp(16px,4vw,32px) 80px}
.scene{animation:in .7s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(36px) scale(.98)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 17px/1 var(--font);padding:16px 30px;border-radius:999px;background:var(--accent);color:#fff;border:0;text-decoration:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .2s}
.btn:hover{transform:scale(1.05);box-shadow:0 14px 40px -10px var(--accent)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.btn[disabled]{opacity:.35;pointer-events:none}
.intro{text-align:center;padding:6vh 0}
.intro h1{font-size:clamp(44px,9vw,120px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.intro p{margin:22px auto 36px;max-width:460px;font-size:clamp(18px,2vw,23px);color:var(--mute);font-weight:500;line-height:1.35}
.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:start}
.solo{max-width:720px;margin:0 auto}

/* własny odtwarzacz */
.vid{position:relative;background:#000;border-radius:28px;overflow:hidden;aspect-ratio:9/16;max-height:72vh;margin:0 auto;width:100%;user-select:none;-webkit-user-select:none}
.vid video{width:100%;height:100%;object-fit:contain;display:block;cursor:pointer}
.vid .play{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.vid .play:hover{transform:scale(1.08)}
.vid .play svg{width:36px;height:36px}
.vid .play[hidden]{display:none}
.vid.frozen .ctl{display:none}
.vid.frozen video{cursor:default}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:30px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ctl button{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;transition:background .2s}
.ctl button:hover{background:rgba(255,255,255,.2)}
.ctl button svg{width:20px;height:20px}
.ctl span{flex:none;color:#fff;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.trk{flex:1;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.trk b{display:block;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.trk i{display:block;height:100%;width:0;background:var(--accent)}

.qbox h2{font-size:clamp(28px,3.6vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-bottom:12px}
.hint{color:var(--mute);font-size:16px;font-weight:500;margin-bottom:22px;min-height:22px}
.opts{display:grid;gap:12px;transition:opacity .4s}
.opts.locked{opacity:.3;pointer-events:none}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px 20px;font-size:19px;font-weight:600;color:var(--ink);background:#fff;border:0;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s}
.opt b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--paper);font-size:15px}
.opt:hover{transform:translateX(6px) scale(1.01);box-shadow:inset 0 0 0 2px var(--ink)}
.opt.ok{background:var(--ok);color:#fff;box-shadow:none}.opt.ok b{background:rgba(255,255,255,.25)}
.opt.no{background:var(--bad);color:#fff;box-shadow:none;animation:shake .4s}.opt.no b{background:rgba(255,255,255,.25)}
.opt.done{pointer-events:none}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin:22px 0 4px;font-size:19px;font-weight:700;min-height:28px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.next{margin-top:18px}
.res.ok{color:var(--ok)}.res.no{color:var(--bad)}

/* dialog z wpisywaniem */
.dlg{display:grid;gap:10px;margin-bottom:6px}
.bub{background:#fff;border-radius:20px 20px 20px 6px;padding:14px 18px;font-size:18px;font-weight:600;line-height:1.3;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);max-width:92%}
.inp{display:block;width:92%;margin-left:auto;padding:15px 18px;font:600 18px/1.3 var(--font);color:var(--ink);background:#fff;border:0;border-radius:20px 20px 6px 20px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);transition:box-shadow .25s,background .25s}
.inp:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.inp.ok{background:var(--ok);color:#fff;box-shadow:none}
.inp.no{background:var(--bad);color:#fff;box-shadow:none}
.dlg .res{width:92%;margin-left:auto;font-size:15px;font-weight:700;min-height:0}

.result{text-align:center;padding:4vh 0}
.result small{font-size:clamp(20px,2.4vw,28px);color:var(--mute);font-weight:600}
.score{font-size:clamp(100px,24vw,300px);font-weight:800;letter-spacing:-.06em;line-height:.9;margin:8px 0 10px}
.score span{color:var(--accent)}
.result p.msg{font-size:clamp(18px,2vw,24px);font-weight:600;margin-bottom:30px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.review{margin:40px auto 0;max-width:720px;text-align:left;display:grid;gap:12px}
.rv{background:#fff;border-radius:18px;padding:16px 20px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);animation:in .6s both}
.rv h3{font-size:17px;font-weight:700;margin-bottom:8px;line-height:1.25}
.rv div{font-size:15px;font-weight:600;line-height:1.5}
.rv .g{color:var(--ok)}.rv .r{color:var(--bad)}.rv .m{color:var(--mute)}

/* nagranie w tle wyników */
.bg{position:fixed;inset:0;z-index:0;background:#000}
.bg video{width:100%;height:100%;object-fit:cover;display:block}
.bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:none}
.bgmu{position:fixed;right:16px;bottom:16px;z-index:5;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.bgmu svg{width:22px;height:22px}
main{position:relative;z-index:1}
.result small{color:rgba(255,255,255,.8)}
.result .score,.result p.msg{color:#fff}

@media(max-width:820px){.split{grid-template-columns:1fr}.vid{max-height:58vh;aspect-ratio:9/14}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<nav>
  <a href="/" aria-label="PatoTesty – strona główna"><img src="https://patotesty.pages.dev/themes/patotesty_horizontal_color.svg" alt="PatoTesty"></a>
  <a class="btn" href="/">Strona główna</a>
</nav>
<div class="bar"><i id="pb"></i></div>
<main id="app"></main>

<script>
const V = "https://patotesty.pages.dev/web-content/wideo/Magda-Klosowska/";
const vid = f => encodeURI(V + f);
const L = "ABCD";
/* Ile sekund ucinamy z końca każdego nagrania (0 = nic nie ucinamy). */
const TRIM = 0;
const WATCH_HINT = "Obejrzyj nagranie do końca i odpowiedz.";

/* k: dialog | video (stop w sekundach, potem dalej do końca) | watch (cały film, potem odpowiedź)
      thumb (tylko miniaturka, po odpowiedzi film do końca) | text (bez nagrania) */
const STEPS = [
  {k:"dialog", q:"Dokończ dialog.", f:"copy_E6DA6754-919D-42EB-8835-B95315BF7FFB.mov", after:"copy_F7645783-185E-4441-8BD9-EF00450A2181.mov",
   lines:[
     {q:"Umyj się kurwa bo jebie", a:"Ale bo mam okres chłopie tłumaczę ci"},
     {q:"Jakoś kurwa inne baby się potrafią umyć", a:"Ale ja mam okres i nie mam podpasek"}
   ]},
  {k:"video", q:"Magda uważa że praca to jest...", f:"copy_A5AC4EA2-845D-46AE-B1C5-2279FFD38C0D.mov", stop:3,
   o:["Zło","Dobro","Nic nie sądzi","Sama pracuje"], c:0},
  {k:"text", q:"Co wydobyło się z armaty Kłosowskiej?",
   o:["Aromat (Pierd)","Okres","Gówno"], c:0},
  {k:"video", q:"Jaką niespodziankę dostała Magda?", f:"copy_79CDE468-2EBB-4CEE-A832-68FC783EE751.mov", stop:6,
   o:["Od widza, gniotka płakał płakał","Brak gazu","Obiad","Pieniądze od Anieli"], c:1},
  {k:"watch", q:"Jak powinien nazywać się salon fryzjerski Magdy?", f:"v26044gc0000db8de8nog65haldd5470.mov",
   o:["Haja","Okres","Fryzjer Magda","Konary 27 Fryzjer & Spa"], c:0},
  {k:"video", q:"Ile renty dostała Magda?", f:"v0f044gc0000cocpuevog65pln50d7p0.mov", stop:1.5,
   o:["50 zł","909 zł","900 zł","800 zł"], c:2},
  {k:"watch", q:"Jak sądzisz kto się zesrał?", f:"v26044gc0000db7rqrfog65t7414sj3g.mov",
   o:["Magda","Aniela","Tomek","Kot"], c:0},
  {k:"video", q:"Podeszła do mnie do łóżka i mówi...", f:"v26044gc0000dav5h1vog65nq3hg3bvg.mov", stop:2.3,
   o:["Kurwo wstawaj","Nie będziesz kurwo spała","Magda wstawaj"], c:0},
  {k:"watch", q:"Dlaczego Magda płakała?", f:"copy_DEC28825-5470-474D-9E90-A186C7EF174E.mov",
   o:["Bank odmówił zwrotu pieniędzy i przejął całą rentę","Tomek uciekł z domu","Aniela chciała się wyprowadzić"], c:0},
  {k:"thumb", q:"Na kogo Magda głosuje", f:"copy_DB73EF99-4D54-4DF0-81B9-31498BCE2279.mov",
   o:["Na PO","Na PiS"], c:1},
  {k:"video", q:"Co Magdzie wpadło do pizdy?", f:"v26044gc0000damlbtnog65jn8nounqg.mov", stop:2,
   o:["Mucha","Osa","Paproch"], c:0}
];
const FINAL = vid("luigi_de_funes - 7357607312602713377.mov");
const MAX = 2 + 10;
const $ = id => document.getElementById(id);
const app = $('app'), pb = $('pb');
let i = -1, score = 0, log = [], raf = 0;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const optsHtml = (o, locked) => `<div class="opts ${locked?'locked':''}" id="opts">` +
  o.map((t,n)=>`<button class="opt" data-n="${n}"><b>${L[n]}</b>${esc(t)}</button>`).join('') + `</div>`;
const scene = html => { cancelAnimationFrame(raf); removeBg(); app.innerHTML = `<div class="scene">${html}</div>`; scrollTo({top:0,behavior:'smooth'}); pb.style.width = Math.max(0,i)/ (STEPS.length) * 100 + '%'; };
const nextBtn = (label='Dalej') => `<button class="btn next" id="nx">${label}</button>`;

function intro(){
  i = -1; score = 0; log = [];
  pb.style.width = '0';
  scene(`<div class="intro"><h1>Magda<br>Kłosowska</h1>
  <p>Test o Magdzie Kłosowskiej. Włącz dźwięk – będą nagrania.</p>
  <button class="btn" id="go">Zacznij test</button></div>`);
  $('go').onclick = () => { i = 0; step(); };
}

/* ---------- własny odtwarzacz ---------- */
const svg = d => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${d}</svg>`;
const ICON = {
  play:   svg('<path d="M8 5v14l11-7z"/>'),
  pause:  svg('<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'),
  replay: svg('<path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>'),
  vol:    svg('<path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>'),
  mute:   svg('<path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9l5 6m0-6l-5 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>')
};
const fmt = t => { t = Math.max(0, t|0); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };

function vidHtml(src, cls=''){
  return `<div class="vid ${cls}"><video id="v" src="${src}" playsinline preload="auto"></video>
  <button class="play" id="pl" aria-label="Odtwórz" hidden></button>
  <div class="ctl">
    <button id="pp" aria-label="Odtwórz / pauza"></button>
    <div class="trk" id="trk"><b><i id="fill"></i></b></div>
    <span id="tm">0:00 / 0:00</span>
    <button id="mu" aria-label="Dźwięk"></button>
  </div></div>`;
}

/* p.limit   – do której sekundy wolno oglądać (null = do końca po ucięciu)
   p.onReach – wywoływane, gdy odtwarzanie dojdzie do limitu / końca
   p.frozen  – nagranie jest tylko miniaturką (nie da się go odpalić) */
function bindPlayer(){
  const v = $('v'), big = $('pl'), pp = $('pp'), fill = $('fill'), tm = $('tm'), mu = $('mu'), trk = $('trk');
  const p = {v, limit:null, reached:false, frozen:false, onReach(){}};
  const end = () => isFinite(v.duration) ? Math.max(.1, v.duration - TRIM) : Infinity;
  const lim = () => Math.min(p.limit == null ? Infinity : p.limit, end());
  const atLimit = () => v.currentTime >= lim() - .05;
  const atEnd = () => v.currentTime >= end() - .05;
  const reach = () => { if(!p.reached){ p.reached = true; p.onReach(); } };

  function ui(){
    const e = end(), t = Math.min(v.currentTime, isFinite(e) ? e : v.currentTime);
    fill.style.width = (isFinite(e) ? Math.min(100, t / e * 100) : 0) + '%';
    tm.textContent = fmt(t) + ' / ' + (isFinite(e) ? fmt(e) : '0:00');
    const ended = isFinite(e) && atEnd();
    const icon = v.paused ? (ended ? ICON.replay : ICON.play) : ICON.pause;
    if(pp.dataset.i !== icon){ pp.dataset.i = icon; pp.innerHTML = icon; }
    const bi = ended ? ICON.replay : ICON.play;
    if(big.dataset.i !== bi){ big.dataset.i = bi; big.innerHTML = bi; }
    big.hidden = p.frozen || !v.paused || (atLimit() && !ended);
  }
  function loop(){
    if(v.currentTime > lim() && isFinite(lim())) v.currentTime = lim();
    if(atLimit() && isFinite(lim())){ if(!v.paused) v.pause(); reach(); }
    ui();
    raf = requestAnimationFrame(loop);
  }
  function play(){ const r = v.play(); if(r && r.catch) r.catch(()=>{}); }
  function toggle(){
    if(p.frozen) return;
    if(!v.paused){ v.pause(); return; }
    if(atLimit()){ v.currentTime = 0; p.reached = false; }
    play();
  }
  let drag = false;
  function seek(e){
    if(p.frozen) return;
    const r = trk.getBoundingClientRect(), e2 = end();
    if(!isFinite(e2)) return;
    const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const t = Math.min(f * e2, lim());
    v.currentTime = t;
    if(t < lim() - .05) p.reached = false;
  }
  trk.onpointerdown = e => { drag = true; trk.setPointerCapture(e.pointerId); seek(e); };
  trk.onpointermove = e => { if(drag) seek(e); };
  trk.onpointerup = trk.onpointercancel = () => { drag = false; };

  v.onclick = big.onclick = pp.onclick = toggle;
  mu.innerHTML = ICON.vol;
  mu.onclick = () => { v.muted = !v.muted; mu.innerHTML = v.muted ? ICON.mute : ICON.vol; };
  v.addEventListener('ended', reach);
  v.addEventListener('error', reach);

  p.play = play;
  p.resume = () => { p.frozen = false; v.closest('.vid').classList.remove('frozen'); p.limit = null; p.reached = false; p.onReach = () => {}; play(); };
  raf = requestAnimationFrame(loop);
  return p;
}

/* ---------- nagranie finałowe w tle wyników ---------- */
function removeBg(){
  const b = $('bg'), m = $('bgmu');
  if(b){ const v = b.querySelector('video'); if(v) v.pause(); b.remove(); }
  if(m) m.remove();
}
function showBg(){
  const d = document.createElement('div'); d.id = 'bg'; d.className = 'bg';
  d.innerHTML = `<video src="${FINAL}" playsinline preload="auto"></video>`;
  const mu = document.createElement('button'); mu.id = 'bgmu'; mu.className = 'bgmu'; mu.setAttribute('aria-label','Dźwięk'); mu.innerHTML = ICON.vol;
  document.body.append(d, mu);
  const v = d.querySelector('video');
  const start = () => { const r = v.play(); if(r && r.catch) r.catch(() => { v.muted = true; mu.innerHTML = ICON.mute; v.play().catch(()=>{}); }); };
  mu.onclick = () => { v.muted = !v.muted; mu.innerHTML = v.muted ? ICON.mute : ICON.vol; if(v.paused) start(); };
  start();
  const loop = () => {
    if(isFinite(v.duration) && v.currentTime >= Math.max(.1, v.duration - TRIM) - .05){ v.currentTime = 0; if(v.paused) start(); }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

/* ---------- porównywanie wpisanych odpowiedzi ---------- */
const norm = s => s.toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function sim(a, b){
  a = norm(a); b = norm(b);
  if(!a || !b) return 0;
  const m = a.length, n = b.length;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let x=1; x<=m; x++){
    const cur = [x];
    for(let y=1; y<=n; y++) cur[y] = Math.min(prev[y]+1, cur[y-1]+1, prev[y-1] + (a[x-1]===b[y-1]?0:1));
    prev = cur;
  }
  return 1 - prev[n] / Math.max(m, n);
}

/* ---------- kroki ---------- */
function step(){
  const s = STEPS[i];
  if(s.k==='dialog') return dialogQ(s);
  if(s.k==='video') return videoQ(s);
  if(s.k==='thumb') return thumbQ(s);
  if(s.k==='watch') return watchQ(s);
  return textQ(s);
}

function answer(s, n, box, p){
  const ok = n === s.c;
  if(ok) score++;
  log.push({q:s.q, chosen:s.o[n], right:s.o[s.c], ok});
  box.querySelectorAll('.opt').forEach((b,x)=>{ b.classList.add('done'); if(x===s.c) b.classList.add('ok'); else if(x===n) b.classList.add('no'); });
  const fb = $('fb');
  fb.className = 'fb ' + (ok?'ok':'no');
  fb.textContent = ok ? 'Dobrze!' : 'Poprawna odpowiedź: ' + s.o[s.c];
  $('nxw').innerHTML = nextBtn();
  $('nx').onclick = () => { i++; next(); };
  if(p) p.resume();   /* dalsza część nagrania, bez startu od zera */
}
function next(){ if(i >= STEPS.length) results(); else step(); }

function dialogQ(s){
  scene(`<div class="split">${vidHtml(vid(s.f))}<div class="qbox"><h2>${esc(s.q)}</h2>
    <p class="hint">Wpisz, co odpowiedziała Magda.</p>
    <div class="dlg">
      <div class="bub">${esc(s.lines[0].q)}</div>
      <input class="inp" id="d0" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Odpowiedź Magdy…">
      <div class="res" id="r0"></div>
      <div class="bub">${esc(s.lines[1].q)}</div>
      <input class="inp" id="d1" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Odpowiedź Magdy…">
      <div class="res" id="r1"></div>
    </div>
    <div id="nxw"><button class="btn next" id="chk" disabled>Sprawdź</button></div></div></div>`);
  const p = bindPlayer();
  p.play();
  const chk = $('chk'), ins = [$('d0'), $('d1')];
  const upd = () => { chk.disabled = !ins.every(x => x.value.trim()); };
  ins.forEach(x => x.addEventListener('input', upd));
  ins.forEach((x,n) => x.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    if(n === 0) ins[1].focus(); else if(!chk.disabled) chk.click();
  }));
  chk.onclick = () => {
    s.lines.forEach((l,n) => {
      const val = ins[n].value.trim(), ok = sim(val, l.a) >= .72;
      if(ok) score++;
      log.push({q:'Dokończ dialog: ' + l.q, chosen:val, right:l.a, ok});
      ins[n].disabled = true; ins[n].classList.add(ok?'ok':'no');
      const r = $('r'+n); r.className = 'res ' + (ok?'ok':'no'); r.textContent = ok ? 'Dobrze!' : 'Poprawnie: ' + l.a;
    });
    $('nxw').innerHTML = nextBtn();
    $('nx').onclick = () => { i++; next(); };
    /* po rozwiązaniu – drugie nagranie */
    p.v.src = vid(s.after); p.v.load();
    p.reached = false;
    p.play();
  };
  ins[0].focus({preventScroll:true});
}

function videoQ(s){
  scene(`<div class="split">${vidHtml(vid(s.f))}<div class="qbox"><h2>${esc(s.q)}</h2>
    <p class="hint"></p>
    ${optsHtml(s.o,true)}<div class="fb" id="fb"></div><div id="nxw"></div></div></div>`);
  const box = $('opts');
  const p = bindPlayer();
  p.limit = s.stop;
  p.onReach = () => box.classList.remove('locked');
  p.play();
  box.onclick = e => { const b = e.target.closest('.opt'); if(b) answer(s, +b.dataset.n, box, p); };
}

function thumbQ(s){
  scene(`<div class="split">${vidHtml(vid(s.f) + '#t=0.1', 'frozen')}<div class="qbox"><h2>${esc(s.q)}</h2>
    <p class="hint"></p>
    ${optsHtml(s.o,true)}<div class="fb" id="fb"></div><div id="nxw"></div></div></div>`);
  const box = $('opts');
  const p = bindPlayer();
  p.frozen = true;
  p.limit = .1;
  p.onReach = () => box.classList.remove('locked');
  const show = () => { p.v.currentTime = .1; };
  if(p.v.readyState >= 1) show(); else p.v.addEventListener('loadedmetadata', show, {once:true});
  setTimeout(() => box.classList.remove('locked'), 3000);
  box.onclick = e => { const b = e.target.closest('.opt'); if(b) answer(s, +b.dataset.n, box, p); };
}

function textQ(s){
  scene(`<div class="solo qbox"><h2>${esc(s.q)}</h2><p class="hint">Wybierz odpowiedź.</p>${optsHtml(s.o)}<div class="fb" id="fb"></div><div id="nxw"></div></div>`);
  const box = $('opts');
  box.onclick = e => { const b = e.target.closest('.opt'); if(b) answer(s, +b.dataset.n, box, null); };
}

function watchQ(s){
  scene(`<div class="split">${vidHtml(vid(s.f))}<div class="qbox"><h2>${esc(s.q)}</h2>
    <p class="hint" id="hint">${esc(s.hint || WATCH_HINT)}</p>${optsHtml(s.o,true)}<div class="fb" id="fb"></div><div id="nxw"></div></div></div>`);
  const box = $('opts');
  const p = bindPlayer();
  p.onReach = () => { box.classList.remove('locked'); $('hint').textContent = 'Wybierz odpowiedź.'; };
  p.play();
  box.onclick = e => { const b = e.target.closest('.opt'); if(b){ p.v.pause(); answer(s, +b.dataset.n, box, null); } };
}

function results(){
  pb.style.width = '100%';
  const pct = score / MAX;
  const msg = pct === 1 ? 'Komplet. Znasz Magdę na wylot.' : pct >= .6 ? 'Całkiem nieźle. Widać, że śledzisz temat.' : 'Do powtórki. Oglądaj uważniej.';
  scene(`<div class="result"><small>Twój wynik</small><div class="score"><span id="sc">0</span>/${MAX}</div><p class="msg">${msg}</p>
    <div class="acts"><button class="btn" id="rv">Sprawdź swoje odpowiedzi</button><button class="btn ghost" id="again">Zagraj jeszcze raz</button><a class="btn ghost" href="/">Strona główna</a></div>
    <div class="review" id="review" hidden></div></div>`);
  showBg();
  const sc = $('sc'); let n = 0;
  const t = setInterval(() => { sc.textContent = n; if(n++ >= score) clearInterval(t); }, 180);
  $('again').onclick = intro;
  $('rv').onclick = () => {
    const r = $('review');
    r.innerHTML = log.map((l,x) => `<div class="rv" style="animation-delay:${x*60}ms"><h3>${esc(l.q)}</h3>
      <div class="${l.ok?'g':'r'}">Twoja odpowiedź: ${esc(l.chosen)}</div>${l.ok?'':`<div class="m">Poprawna: ${esc(l.right)}</div>`}</div>`).join('');
    r.hidden = false; r.scrollIntoView({behavior:'smooth', block:'start'});
  };
}

intro();
</script>

</html>
